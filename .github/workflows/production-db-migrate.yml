# Velnox PRODUCTION database reconcile
#
# THIS is the production database workflow — the only workflow in this
# repository permitted to write to the production Neon database. It was
# previously `migrate-neon.yml`, then `production-db-migrate`; the engine is the
# same safety envelope (read the database identity BEFORE writing, never fall
# back to another connection string), and what it applies has changed.
#
# There is no migration directory any more. `db/schema.sql` is the canonical
# snapshot and `db/run-sqleditor.sql` is the rerunnable reconciler that brings
# an existing database to that snapshot: additive columns, guarded indexes,
# definition-probed constraints. It never drops a table, never drops a column,
# never truncates and never deletes, and a second run is a no-op.
#
# Canonical secret: NEON_PRODUCTION_DATABASE_URL — the SAME Neon project and
# branch Render's `DATABASE_URL` points at. There is deliberately NO fallback to
# any other variable: a silently-substituted connection string is what caused a
# migration to reach a database production does not use (§66).
#
# Triggers are MANUAL ONLY, never "on every push": applying schema to a
# production database is an operator decision, and the reconciler is rerunnable
# so there is no window it has to be applied in.
#
# Verification is SEPARATE: this workflow reconciles, `production-db-verify.yml`
# verifies. Verification never creates an object; this workflow never asserts.

name: Production DB Reconcile

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reconcile production" to confirm a write to the production database'
        required: true
        type: string

env:
  NEON_PRODUCTION_DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL }}

jobs:
  reconcile:
    name: Reconcile Database Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm the operator intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "reconcile production" ]; then
            echo "::error::BLOCKED: confirmation text did not match. Type 'reconcile production'."
            exit 1
          fi

      - name: Validate production database secret
        run: |
          # Hard stop when the canonical secret is absent. There is NO fallback
          # to DATABASE_URL or to any retired variable: a run that silently
          # reached a different Neon is precisely the incident this repository
          # is being aligned to eliminate.
          if [ -z "$NEON_PRODUCTION_DATABASE_URL" ]; then
            echo "::error::BLOCKED: NEON_PRODUCTION_DATABASE_URL is not configured."
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name: NEON_PRODUCTION_DATABASE_URL"
            echo "   Value: the Neon connection string for the SAME project/branch that Render's DATABASE_URL uses."
            exit 1
          fi
          echo "✅ NEON_PRODUCTION_DATABASE_URL is configured (value not printed)."

      - name: Confirm which database this is before writing to it
        run: |
          # Read the identity FIRST. Writing to the wrong database is not
          # recoverable by re-running this workflow, so the target is proven
          # before a single statement is applied.
          psql "$NEON_PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -F ' | ' -c "
            SELECT 'DATABASE IDENTITY',
                   'database=' || current_database(),
                   'schema=' || current_schema(),
                   'server=' || current_setting('server_version'),
                   'user=' || current_user;
          "
          echo "Compare the line above with the [db] line the live backend logs at boot."
          echo "If they differ, STOP — this secret does not point at production."

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply the reconciler
        run: |
          set -e
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 Applying db/run-sqleditor.sql"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          # --single-transaction: either the whole reconciler lands or none of
          # it does. ON_ERROR_STOP makes psql exit non-zero on the first failed
          # statement instead of continuing past a half-applied schema.
          if psql "$NEON_PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f db/run-sqleditor.sql; then
            echo "✅ reconciler applied successfully."
          else
            echo "❌ reconciler FAILED."
            echo "   Nothing was committed (single transaction). Fix db/run-sqleditor.sql and re-run."
            exit 1
          fi

      - name: Report what the database now holds
        run: |
          echo "📊 Tables and constraints the reconciler reports:"
          psql "$NEON_PRODUCTION_DATABASE_URL" -c "
            SELECT count(*) AS tables
              FROM information_schema.tables
             WHERE table_schema = 'public' AND table_type = 'BASE TABLE';
          "
          psql "$NEON_PRODUCTION_DATABASE_URL" -c "
            SELECT conname
              FROM pg_constraint
             WHERE connamespace = 'public'::regnamespace
               AND contype = 'c'
             ORDER BY conname
             LIMIT 20;
          "
