# Velnox Neon Database Migration
#
# Applies incremental migrations from db/migrations/ to the Neon production database.
# NEVER runs schema.sql or run-sqleditor.sql — only individual migration files.
#
# Usage:
#   - Automatic: runs on push to main when db/migrations/*.sql changes
#   - Manual: workflow_dispatch with optional migration file selection

name: Migrate Neon Database

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/*.sql'
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Specific migration file to run (e.g. 013_schema_migrations_and_address_fixes.sql). Leave empty to run all pending.'
        required: false
        type: string

env:
  NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

jobs:
  migrate:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Neon URL secret
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "❌ NEON_DATABASE_URL secret is not set."
            echo "   Go to Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name: NEON_DATABASE_URL"
            echo "   Value: your neon postgres connection string"
            exit 1
          fi
          echo "✅ NEON_DATABASE_URL is configured."

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Ensure schema_migrations table exists
        run: |
          psql "$NEON_DATABASE_URL" -c "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              id BIGSERIAL PRIMARY KEY,
              migration_name TEXT UNIQUE NOT NULL,
              applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );
          "
          echo "✅ schema_migrations table ready."

      - name: Detect pending migrations
        id: detect
        run: |
          echo "🔍 Checking for pending migrations..."

          # Get list of already-applied migrations
          APPLIED=$(psql "$NEON_DATABASE_URL" -t -A -c "SELECT migration_name FROM schema_migrations ORDER BY id;" 2>/dev/null || echo "")
          echo "Already applied: $APPLIED"

          PENDING=()

          if [ -n "${{ github.event.inputs.migration_file }}" ]; then
            # Manual: run specific file
            FILE="${{ github.event.inputs.migration_file }}"
            if echo "$APPLIED" | grep -q "^${FILE%.sql}$"; then
              echo "⚠️ Migration $FILE already applied. Skipping."
              exit 0
            fi
            if [ ! -f "db/migrations/$FILE" ]; then
              echo "❌ Migration file not found: db/migrations/$FILE"
              exit 1
            fi
            PENDING+=("$FILE")
          else
            # Automatic: find all pending migrations
            for f in db/migrations/*.sql; do
              fname=$(basename "$f" .sql)
              if ! echo "$APPLIED" | grep -q "^${fname}$"; then
                PENDING+=("$(basename "$f")")
              fi
            done
          fi

          if [ ${#PENDING[@]} -eq 0 ]; then
            echo "✅ No pending migrations."
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "📋 Pending migrations:"
            for p in "${PENDING[@]}"; do
              echo "  - $p"
            done
            # Store as newline-separated list
            printf '%s\n' "${PENDING[@]}" > /tmp/pending_migrations.txt
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending migrations
        if: steps.detect.outputs.has_pending == 'true'
        run: |
          set -e

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            migration_name="${file%.sql}"
            filepath="db/migrations/$file"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Applying: $migration_name"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Run the migration inside a transaction
            if psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$filepath"; then
              # Record successful migration
              psql "$NEON_DATABASE_URL" -c "
                INSERT INTO schema_migrations (migration_name)
                VALUES ('$migration_name')
                ON CONFLICT (migration_name) DO NOTHING;
              "
              echo "✅ $migration_name applied successfully."
            else
              echo "❌ $migration_name FAILED."
              echo "   Stopping. Fix the migration and re-run."
              exit 1
            fi

          done < /tmp/pending_migrations.txt

          echo ""
          echo "🎉 All migrations applied successfully."

      - name: Verify migration state
        if: steps.detect.outputs.has_pending == 'true'
        run: |
          echo "📊 Current migration state:"
          psql "$NEON_DATABASE_URL" -c "SELECT id, migration_name, applied_at FROM schema_migrations ORDER BY id;"
