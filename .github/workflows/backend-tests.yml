# Velnox backend tests — disposable PostgreSQL, never production.
#
# TASK 004A: the backend integration tests used to create fixture rows in
# whatever database `DATABASE_URL` pointed at. `bun test` auto-loads `.env`, so a
# developer workspace (and any job that exported the production URL) wrote
# fixture shops (`so-test-*`, `inv-*`) into production.
#
# This workflow is the CI half of the fix: the suite runs against a throwaway
# PostgreSQL service container, bootstrapped from db/run-sqleditor.sql, and is
# given TEST_DATABASE_URL only — never the production DATABASE_URL.
#
# The test isolation guard (backend/db/database-guard.ts) fails the run if
# TEST_DATABASE_URL is missing, points at the application DATABASE_URL, carries a
# production marker, or lacks a disposable name. So this job cannot be pointed
# at production by accident: it would fail closed instead.

name: Backend Tests

# `push` deliberately has NO branch filter: the regression this workflow guards
# against (the suite writing fixtures into whatever `DATABASE_URL` pointed at)
# was introduced on a feature branch, and a `branches: [main]` filter meant the
# job could not run there. The `paths` filter already scopes it to backend/db
# changes, so every branch that can break the suite gets tested.
#
# `workflow_dispatch` only works once this file is on the default branch —
# GitHub cannot dispatch a workflow that main does not contain yet.
on:
  push:
    paths:
      - 'backend/**'
      - 'db/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'db/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velnox
          POSTGRES_PASSWORD: velnox
          POSTGRES_DB: velnox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velnox -d velnox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Disposable container database only. No DATABASE_URL is set on purpose:
      # the test suite must never have a production target to fall back to.
      TEST_DATABASE_URL: postgresql://velnox:velnox@localhost:5432/velnox_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bootstrap the disposable test database
        run: |
          echo "🗄️  Applying db/run-sqleditor.sql to the throwaway container database"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/run-sqleditor.sql
          echo "✅ Test database ready"

      - name: Typecheck backend
        run: cd backend && bun tsc --noEmit

      - name: Backend tests (isolated)
        run: bun test backend/tests
