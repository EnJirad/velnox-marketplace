name: Android VelShop

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-velshop.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-velshop:
    name: Build VelShop Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c
          build-tools-version: '35.0.0'
          cmdline-tools-version: 'latest'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew :app-velshop:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app-velshop:lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app-velshop:assembleDebug --no-daemon

      - name: Verify APK exists and non-empty
        run: |
          APK_PATH="app-velshop/build/outputs/apk/debug/app-velshop-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH")
          if [ "$SIZE" -eq 0 ]; then
            echo "❌ APK is empty"
            exit 1
          fi
          echo "✅ APK verified: $APK_PATH ($SIZE bytes)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: velshop-debug-apk
          path: android/app-velshop/build/outputs/apk/debug/app-velshop-debug.apk
          retention-days: 7
