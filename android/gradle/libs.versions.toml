[versions]
# Android
agp = "8.7.3"
compileSdk = 35
minSdk = 24
targetSdk = 35

# Kotlin
kotlin = "2.0.21"
kotlinCompose = "2.0.21"

# Compose BOM
composeBom = "2024.10.00"

